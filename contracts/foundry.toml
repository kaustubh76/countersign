[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.30"
# BSC mainnet runs Cancun, Prague and Osaka opcodes (verified 2026-11-25). Pinned so the
# compiler default (osaka from 0.8.31) can never change bytecode silently.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_archive = "${BSC_ARCHIVE_RPC_URL}"

[etherscan]
bsc = { key = "${ETHERSCAN_API_KEY}", chain = 56, url = "https://api.etherscan.io/v2/api?chainid=56" }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
